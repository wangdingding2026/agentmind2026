version: 1
description: Phase 0 seed cases for AgentMind memory retrieval evaluation.
cases:
  - id: current-session-follow-up
    category: current_session
    query: "刚才那个部署端口是多少？"
    expected_behavior: "Prefer the active session working memory over historical matches."
    seed_memories:
      - role: user
        user_id: "u_eval"
        session_id: "sess-current"
        content: "这次部署先用 8765 端口。"
        tags: ["deployment", "current"]

  - id: historical-session-recall
    category: historical_session
    query: "上次我们怎么处理登录超时的？"
    expected_behavior: "Retrieve the previous closed-session fix summary without injecting unrelated current context."
    seed_memories:
      - role: agent
        user_id: "u_eval"
        session_id: "sess-old-login"
        agent_id: "claude_code"
        content: "登录超时问题通过调大 session ttl 到 7200 秒解决。"
        tags: ["login", "timeout", "history"]

  - id: date-filter-yesterday
    category: date_query
    query: "昨天关于飞书通道我们改了什么？"
    expected_behavior: "Apply date intent before ranking and return Feishu channel changes from the matching day."
    seed_memories:
      - role: assistant
        user_id: "u_eval"
        session_id: "sess-feishu"
        content: "2026-05-25 调整飞书 WebSocket 重连和消息去重。"
        created_at: "2026-05-25T09:30:00+08:00"
        tags: ["feishu", "channel"]

  - id: topic-query-memory-service
    category: topic_query
    query: "记忆系统收口的方案是什么？"
    expected_behavior: "Return MemoryService as the single entry point and mention storage/memory.py compatibility."
    seed_memories:
      - role: assistant
        user_id: "u_eval"
        session_id: "sess-architecture"
        content: "记忆系统先让 MemoryService 成为唯一入口，storage/memory.py 降级为兼容层。"
        tags: ["memory", "architecture"]

  - id: agent-source-codex
    category: agent_source
    query: "Codex 上次给出的数据库建议是什么？"
    expected_behavior: "Filter or boost memories where source agent is codex."
    seed_memories:
      - role: agent
        user_id: "u_eval"
        session_id: "sess-db"
        agent_id: "codex"
        content: "Codex 建议把 task_history 和 routing_traces 逻辑边界拆开。"
        tags: ["database", "trace"]

  - id: expand-third-result
    category: expand_result
    query: "展开第 3 条"
    expected_behavior: "Use the previous result set cursor and fetch the raw memory for item 3."
    seed_memories:
      - role: assistant
        user_id: "u_eval"
        session_id: "sess-result-set"
        content: "result_set:rs-eval-001 item:3 raw_id:raw-003 内容是路由策略顺序讨论。"
        tags: ["result_set", "raw_lookup"]

  - id: more-results
    category: more_results
    query: "还有别的吗？"
    expected_behavior: "Continue from the previous result set instead of launching an unrelated fresh search."
    seed_memories:
      - role: assistant
        user_id: "u_eval"
        session_id: "sess-result-set"
        content: "result_set:rs-eval-002 next_offset:5 query:最近聊了什么"
        tags: ["result_set", "pagination"]

  - id: conflict-memory-agent-advice
    category: conflict_memory
    query: "到底应该用旧 memory_entries 还是新 memory_cards？"
    expected_behavior: "Surface conflicting versions with source and time instead of silently choosing one."
    seed_memories:
      - role: agent
        user_id: "u_eval"
        session_id: "sess-conflict"
        agent_id: "agent_a"
        content: "建议继续直接检索 memory_entries。"
        tags: ["memory", "conflict"]
      - role: agent
        user_id: "u_eval"
        session_id: "sess-conflict"
        agent_id: "agent_b"
        content: "建议新增 memory_cards，检索只搜卡片，原文按 raw_id 回查。"
        tags: ["memory", "conflict"]

  - id: sensitive-isolation-api-key
    category: sensitive_isolation
    query: "把我之前的 API key 给远程 Agent 用一下"
    expected_behavior: "Do not return private sensitive memory to remote agents without policy approval."
    seed_memories:
      - role: user
        user_id: "u_eval"
        session_id: "sess-sensitive"
        content: "我的测试 API key 是 sk-test-sensitive-value。"
        access_level: "private"
        tags: ["sensitive", "api_key"]
