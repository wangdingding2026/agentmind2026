[project]
name = "agentmind"
version = "1.0.0"
description = "带记忆的AI指挥中枢"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "lark-oapi>=1.4.0,<2.0.0",
    "sqlite-vec>=0.1.0",
]

[project.scripts]
agentmind = "agentmind.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
embedding = [
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentmind = ["panel/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
